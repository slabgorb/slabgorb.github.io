# Repository Configuration for slabgorb.github.io
# Generated by Pennyfarthing project-setup workflow

pr_title_format: "{type}({scope}): {title}"

repos:
  site:
    path: .
    type: ui
    description: >-
      Personal art & AI portfolio site (slabgorb.com). Jekyll static site
      using the github-pages gem and the midnight theme. Content lives in
      numbered Markdown pages (01_index, 02_wmata, etc.) and assets/.
    language: ruby
    languages: [ruby, html, scss, markdown]
    framework: jekyll
    build_command: bundle exec jekyll build
    dev_command: bundle exec jekyll serve
    notes: |
      Built output goes to _site/. Deployed to Cloudflare via ./deploy.sh,
      which builds the site, uploads _site/ to the `slabgorb` R2 bucket, and
      runs `wrangler deploy`. Task recipes available via `just`.

  worker:
    path: worker
    type: api
    description: >-
      Cloudflare Worker that serves the built Jekyll site (_site) from the
      R2 bucket bound as env.BUCKET. Routes the apex (slabgorb.com) and www.
    language: javascript
    framework: cloudflare-workers
    notes: |
      Entry point: worker/index.js. Configured by wrangler.toml. Deployed
      together with the site by ./deploy.sh.

# Architecture notes:
# Single Git repo. The Jekyll site is built locally/CI and served from
# Cloudflare R2 by a Worker on the edge — GitHub Pages is no longer the
# serving path (CNAME was removed). `deploy.sh` is the single deploy entry.
